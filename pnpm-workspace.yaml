packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  less: false
  lmdb: true
  msgpackr-extract: true
  msw: true
  nx: true
  sharp: true
  unrs-resolver: true
blockExoticSubdeps: true
catalogs:
  angular:
    '@analogjs/storybook-angular': '2.7.5'
    '@analogjs/vite-plugin-angular': '2.7.5'
    '@analogjs/vitest-angular': '2.7.5'
    '@angular-devkit/build-angular': '22.2.0'
    '@angular-eslint/builder': '^22.5.0'
    '@angular-eslint/bundled-angular-compiler': '^22.5.0'
    '@angular-eslint/eslint-plugin': '^22.5.0'
    '@angular-eslint/eslint-plugin-template': '^22.5.0'
    '@angular-eslint/schematics': '^22.5.0'
    '@angular-eslint/template-parser': '22.5.0'
    '@angular/animations': '22.2.0'
    '@angular/build': '22.2.0'
    '@angular/common': '22.2.0'
    '@angular/compiler': '22.2.0'
    '@angular/compiler-cli': '22.2.0'
    '@angular/core': '22.2.0'
    '@angular/forms': '22.2.0'
    '@angular/platform-browser': '22.2.0'
    '@angular/platform-server': '22.2.0'
    '@angular/router': '22.2.0'
    '@ng-icons/core': '36.1.0'
    '@ng-icons/phosphor-icons': '36.1.0'
    '@schematics/angular': '22.2.0'
    angular-eslint: '22.5.0'
    ng-packagr: '22.2.2'
    zone.js: '^0.16.1'
  angular-supported-versions:
    '@angular/common': '>= 22.0.0 < 23.0.0'
    '@angular/core': '>= 22.0.0 < 23.0.0'
    '@angular/forms': '>= 22.0.0 < 23.0.0'
  designsystemet:
    '@digdir/designsystemet': '1.21.0'
    '@digdir/designsystemet-css': '1.21.0'
    '@digdir/designsystemet-react': '1.21.0'
    '@digdir/designsystemet-web': '1.21.0'
    '@navikt/aksel-icons': '8.10.3'
  # Dev-only: Storybook stories in packages/web are written as lit templates,
  # and @storybook/web-components requires lit as a peer dependency
  lit:
    lit: '^3.3.0'
  nx:
    '@nx/angular': '23.2.1'
    '@nx/devkit': '23.2.1'
    '@nx/eslint': '23.2.1'
    '@nx/eslint-plugin': '23.2.1'
    '@nx/js': '23.2.1'
    '@nx/playwright': '23.2.1'
    '@nx/react': '23.2.1'
    '@nx/storybook': '23.2.1'
    '@nx/vite': '23.2.1'
    '@nx/vitest': '23.2.1'
    '@nx/web': '23.2.1'
    nx: '23.2.1'
  react:
    '@types/react': '19.2.14'
    '@types/react-dom': '19.2.3'
    react: '19.2.4'
    react-dom: '19.2.4'
  react-supported-versions:
    react: '>=18.3.1'
    react-dom: '>=18.3.1'
  storybook:
    '@storybook/addon-docs': '10.2.17'
    '@storybook/angular': '10.5.8'
    '@storybook/html': '10.2.17'
    '@storybook/html-vite': '10.5.8'
    '@storybook/react': '10.2.17'
    '@storybook/react-vite': '10.2.17'
    '@storybook/web-components': '10.2.17'
    '@storybook/web-components-vite': '10.2.17'
    storybook: '10.5.8'
  testing-library:
    '@testing-library/angular': '^17.4.0'
    '@testing-library/dom': '10.4.1'
    '@testing-library/jest-dom': '~6.6.3'
    '@testing-library/react': '^16.3.0'
    '@testing-library/user-event': '^14.6.1'
  typescript:
    '@types/node': '^24.12.4'
    ts-morph: '^27.0.2'
    tslib: '^2.8.1'
    tsx: '4.8.1'
    typescript: '6.0.3'
    vite-plugin-dts: '~4.5.4'
  vitest:
    '@vitest/coverage-v8': '4.1.0'
    '@vitest/ui': '4.1.0'
    vite: '8.2.1'
    vitest: '4.1.0'
  vitest-a11y:
    vitest-axe: '^0.1.0'
cleanupUnusedCatalogs: true
minimumReleaseAge: 2880
trustPolicy: 'no-downgrade'
trustPolicyExclude:
  - 'chokidar@4.0.3'
  - 'detect-port@1.6.1'
  - 'undici-types@6.21.0'
  - 'semver@6.3.1'
  - 'express-rate-limit@8.3.0'
trustPolicyIgnoreAfter: 10080
verifyDepsBeforeRun: 'prompt'
overrides:
  '@angular/platform-browser-dynamic': 22.2.0
  vite: catalog:vitest
publicHoistPattern:
  - '@angular/*'
  - '@digdir/designsystemet-web'
